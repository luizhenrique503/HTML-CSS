<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
       <form action="cadastro.php" method="post">
        <p>
            <label for="icor">Cor</label>
            <input type="color" name="cor" id="icolor">
        </p>
        <p>
            <label for="ifoto">Foto</label>
            <input type="file" name="ifoto" id="foto">
        </p>
        <p>
            <label for="inivel">Nível de Satisfação:</label>
            <input type="range" name="nivel" id="inivel">
        </p>
        <p>
           <label for="imsg">Mensagens</label> 
           <textarea name="msg" id="imsg" cols="30" rows="10">Mensagens</textarea>
        </p>
         <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="limpar">
        </p>
</body>
</html>
