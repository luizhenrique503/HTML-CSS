<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário</title>
</head>
<body>
   <h1>Teste de Formulário</h1> 
   <form action="cadastro.php" method="POST" autocomplete="on">
    <p>
        <label for="iusu">Usuário</label>
        <input type="text" name="usu" id="iusu" required minlength="3" maxlength="8" placeholder="Nome do Usuário">
    </p>
    <p>
        <label for="isen">Senha:</label>
        <input type="password" name="sen" id="isen" required minlength="3" maxlength="8" placeholder="Senha do Usuário">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar" >
    </p>
   </form>
</body>
</html>
